name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The auto-merge workflow starts this workflow after a merge, because a
  # merge by GITHUB_TOKEN starts no push run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt, which pins every gate tool. Each
  # check name starts with the job ID, for example "gates / Ruff (lint)".
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      python-version: '3.13'
      cache-dependency-path: |
        requirements.txt
        requirements-dev.txt
      ruff: true
      ruff-args: app.py mist_connection.py
      black: true
      black-args: app.py mist_connection.py
      mypy: true
      mypy-args: app.py mist_connection.py
      bandit: true
      bandit-args: -r app.py mist_connection.py -ll
      pip-audit: true
      radon: true
      radon-args: app.py mist_connection.py
      radon-max: 15
      vulture: true
      vulture-args: app.py mist_connection.py --min-confidence 90 --ignore-decorators @app.route

  # The shared workflow opens one issue for each failed gate on main and closes
  # that issue after the gate passes. It reads the results output of the gates.
  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      results: ${{ needs.gates.outputs.results }}
