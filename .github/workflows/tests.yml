name: Offline Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      # The quality gates install requirements-dev.txt, not the lock file, so
      # they miss a version conflict in requirements-dev.lock.txt (issue #24).
      # A dry run resolves the lock and fails on a conflict.
      - run: python -m pip install --dry-run -r requirements-dev.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.cjs
