name: CodeQL Analysis

on:
  # No branch filter here, so a pull request against any base runs the scan.
  # A filter that names main alone lets a stacked pull request merge without a
  # scan, because the required check never starts and never reports.
  pull_request:
  push:
    branches: [main]
  # Run each Monday at 06:00 UTC, so new CodeQL queries examine unchanged code.
  schedule:
    - cron: '0 6 * * 1'
  # GitHub starts no push run for a merge by GITHUB_TOKEN, so a manual run
  # refreshes the scan on main.
  workflow_dispatch:

# Each job names its own scopes.
permissions: {}

# A new commit on a pull request branch cancels the previous run. A run on
# main is never cancelled, so each commit on main gets a complete scan.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID, so the alerts
  # keep the key .github/workflows/codeql.yml:analyze and the category
  # /language:python. Do not rename this file.
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
