name: Build and Push Container

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # The shared workflow in misthelper-devtools builds the multi-arch image with
  # Buildx and pushes it to GHCR. A pull request build does not push.
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@e0bcb680817721a41d3add1dfb7498afeadb6503 # v0.3.0
    with:
      push: ${{ github.event_name != 'pull_request' }}
      tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=sha,prefix=
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}